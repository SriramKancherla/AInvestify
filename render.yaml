services:
  - type: web
    name: ainvestify
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Required in production: default TrustedHostMiddleware only allows "localhost" without this.
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: FRONTEND_DIR
        value: frontend
      # The Pages site calls this API from the browser. Production and preview
      # hostnames are both under pages.dev.
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: "https://([a-z0-9-]+\\.)+pages\\.dev"
      - key: APP_ENV
        value: production
      - key: ENABLE_PROXY_HEADERS
        value: "true"
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: CORS_ALLOW_METHODS
        value: GET,POST,PUT,DELETE,OPTIONS
      - key: CORS_ALLOW_HEADERS
        value: Content-Type,Authorization
      - key: RATE_LIMIT_INSIGHTS_COUNT
        value: "60"
      - key: RATE_LIMIT_INSIGHTS_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_CHATBOT_COUNT
        value: "30"
      - key: RATE_LIMIT_CHATBOT_WINDOW_SECONDS
        value: "60"
      - key: HTTP_RETRY_COUNT
        value: "2"
      - key: HTTP_RETRY_BACKOFF_MS
        value: "300"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "12"
      # Optional Gemini chatbot:
      # - key: GEMINI_API_KEY
      #   sync: false
      # --- WhatsApp alerts (pick one provider) ---
      # Twilio:
      # - key: TWILIO_ACCOUNT_SID
      # - key: TWILIO_AUTH_TOKEN
      # - key: TWILIO_WHATSAPP_FROM
      #   value: "+14155238886"
      # Meta Cloud API:
      # - key: WHATSAPP_CLOUD_TOKEN
      # - key: WHATSAPP_PHONE_NUMBER_ID

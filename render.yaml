services:
  - type: web
    name: ainvestify
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Required in production: default TrustedHostMiddleware only allows "localhost" without this.
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: FRONTEND_DIR
        value: frontend-2
      # Optional: set to your exact site URL(s) if you add a separate API domain or custom domain.
      # - key: CORS_ALLOW_ORIGINS
      #   value: "https://YOUR-SERVICE.onrender.com"
      - key: APP_ENV
        value: production
      - key: ENABLE_PROXY_HEADERS
        value: "true"
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: CORS_ALLOW_METHODS
        value: GET,POST,PUT,DELETE,OPTIONS
      - key: CORS_ALLOW_HEADERS
        value: Content-Type,Authorization
      - key: RATE_LIMIT_INSIGHTS_COUNT
        value: "60"
      - key: RATE_LIMIT_INSIGHTS_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_CHATBOT_COUNT
        value: "30"
      - key: RATE_LIMIT_CHATBOT_WINDOW_SECONDS
        value: "60"
      - key: HTTP_RETRY_COUNT
        value: "2"
      - key: HTTP_RETRY_BACKOFF_MS
        value: "300"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "12"
      # --- Email OTP SMTP (used by /api/auth/*-otp/send) ---
      # Note: if port 587 fails due to STARTTLS/network issues, port 465 (SSL) is usually more reliable.
      - key: EMAIL_SMTP_HOST
        value: smtp.gmail.com
      - key: EMAIL_SMTP_PORT
        value: "465"
      # --- Supabase (required for per-user portfolio / watchlists / JWT verification in production) ---
      # - key: SUPABASE_URL
      #   sync: false
      # - key: SUPABASE_SERVICE_ROLE_KEY
      #   sync: false
      # - key: SUPABASE_ANON_KEY
      #   sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Optional if issuer differs from {SUPABASE_URL}/auth/v1
      # - key: SUPABASE_JWT_ISSUER
      #   value: https://YOUR_PROJECT.supabase.co/auth/v1
      # --- WhatsApp alerts (pick one provider) ---
      # Twilio:
      # - key: TWILIO_ACCOUNT_SID
      # - key: TWILIO_AUTH_TOKEN
      # - key: TWILIO_WHATSAPP_FROM
      #   value: "+14155238886"
      # Meta Cloud API:
      # - key: WHATSAPP_CLOUD_TOKEN
      # - key: WHATSAPP_PHONE_NUMBER_ID
